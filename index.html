<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem BK Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-wrapper">
        <section class="login-container">
        
            <div class="login-hero">
                <div class="hero-icon-glow">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h1 class="hero-title">Sistem <span>BK Digital</span></h1>
                <p class="hero-desc">Sahabat konseling siswa sekolah. Aman, nyaman, dan privasi Anda terjamin 100%.</p>

                <div class="hero-pills">
                    <div class="trust-badge"><i class="fa-solid fa-shield-halved"></i> 100% Rahasia</div>
                    <div class="trust-badge"><i class="fa-solid fa-bolt"></i> Respon Cepat</div>
                    <div class="trust-badge"><i class="fa-solid fa-user-check"></i> Guru Bersertifikat</div>
                </div>
            </div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="input-pill-box primary-style">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="input-nama" placeholder="Nama" required autocomplete="name">
                </div>

                <div class="input-pill-box secondary-style">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="input-password" placeholder="Password" required autocomplete="current-password">
                    <i class="fa-regular fa-eye-slash toggle-eye" onclick="togglePass('input-password', this)" title="Lihat Password"></i>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Masuk</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
